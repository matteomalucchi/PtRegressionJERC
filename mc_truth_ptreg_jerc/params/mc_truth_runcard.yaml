# =============================================================================
# Run card for the column-based MC truth derivation (mc_truth_columns_config.py)
#
# This file replaces the pile of environment variables (YEAR, PNET, UPART,
# CLOSURE, SIGN, FLAVSPLIT, CARTESIAN, ...) that the old exec.py exported in
# bash. Everything the configuration needs is declared here.
#
# You normally do not edit this file by hand: `run_mc_truth.py` writes a copy of
# it, with the command-line overrides applied, into the output directory and
# points the configuration to it. Editing it directly is still supported when
# running `pocket-coffea run --cfg mc_truth_columns_config.py` by hand.
# =============================================================================

# Data-taking / MC campaign to process. One of the keys of `samples` below.
year: 2023_preBPix

# Dataset definition files (relative to the mc_truth_ptreg_jerc directory) and
# the sample name to select for each year.
dataset_jsons:
  - datasets/QCD_redirector.json
samples:
  "2016_PreVFP": QCD_PT-15to7000_JMENano_Summer20UL16APV
  "2016_PostVFP": QCD_PT-15to7000_JMENano_Summer20UL16
  "2017": QCD_PT-15to7000_JMENano_Summer20UL17
  "2018": QCD_PT-15to7000_JMENano_Summer20UL18
  "2022_preEE": QCD_PT-15to7000_JMENanov15_Summer22
  "2022_postEE": QCD_PT-15to7000_JMENanov15_Summer22EE
  "2023_preBPix": QCD_PT-15to7000_JMENanov15_Summer23
  "2023_postBPix": QCD_PT-15to7000_JMENanov15_Summer23BPix
  "2024": QCD_PT-15to7000_JMENano_Summer24
  "2025": QCD_PT-15to7000_JMENano_Winter25

# Directory where the per-chunk parquet files are written. `{year}` is
# substituted with the year above. It can be a local path or an xrootd URL.
columns_output_dir: "root://t3dcachedb03.psi.ch:1094//pnfs/psi.ch/cms/trivcat/store/user/mmalucch/out_mc_truth_ptreg/out_mc_truth_{year}/parquet_files"

# ----------------------------------------------------------------------------
# Physics options (forwarded to MCTruthProcessor via workflow_options)
# ----------------------------------------------------------------------------

# Compute the ParticleNet / UParT regressed response. Both are run in the same
# job: there is no reason any more to launch one job per tagger.
pnet: true
upart: true

# Also build the neutrino-inclusive gen jet collection (MatchedJetsNeutrino).
neutrinos: true

# deltaR cone used to match reco jets to gen jets.
deltaR_matching: 0.2

# Minimum gen jet pT [GeV]. 0 keeps everything; the pT binning is applied
# offline on the columns.
genjet_pt_cut: 0

# Number of leading (raw-pT ordered) reco jets kept per event.
n_jets: 3

# Centre-of-mass energy [TeV], used to drop unphysical jets (E > E_beam).
com_energy: 13.6

# Re-apply the standard L2Relative MC truth correction on top of the raw jet pT
# to define the "JEC" response. When false, the jet pT calibrated by
# PocketCoffea (jets_calibration.yaml) is used instead.
reapply_jec: true

# Closure test: apply the freshly derived MC truth corrections on top of each
# regression. The txt files are taken from params/ via params/l2relative_txt.py.
closure: false

# What to do when a regression factor is not positive:
#   "raw"      - fall back to the raw jet pT (recommended)
#   "original" - keep whatever the tagger returned
#   <float>    - set pT and response to this value
regression_value_when_invalid: raw

# Above this |eta| the regression output is replaced by the raw jet, because
# the taggers are not trained there. Set to null to disable.
invalid_regression_eta: 4.7

# Preselection on the distance between the reconstructed and the generated
# primary vertex [cm].
pv_presel_distance: 0.2
