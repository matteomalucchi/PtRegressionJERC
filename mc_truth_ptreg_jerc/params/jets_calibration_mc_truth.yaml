# =============================================================================
# Jets calibration for the column-based MC truth derivation
# (mc_truth_columns_config.py + mc_truth_workflow.py)
#
# The only job of this file is to let the PocketCoffea `JetsCalibrator`
# (pocket_coffea.lib.calibrators.common.common) APPLY THE pT REGRESSION, exactly
# as it is done for the MET studies in
# `met_ptreg_performance/params/jets_calibration_MET_calibrator_noJER.yaml`.
#
# How it works
# ------------
# * `mc_truth_workflow.py` clones the NanoAOD `Jet` collection once per
#   regression (`JetPNetReg`, `JetPNetRegNeutrino`, `JetUparTReg`,
#   `JetUparTRegNeutrino`) in `process_extra_after_skim`, i.e. before the
#   calibrators are initialized.
# * `apply_pt_regr_MC` (and `apply_pt_regr_Data`) is True for the regression jet
#   types, so the calibrator replaces `pt`/`mass` of each clone with the
#   regressed values (raw pT x regression factor) and sets `rawFactor` to 0.
#   Which tagger is used is decided by the NAME of the jet type:
#     "PNet"        -> PNetRegPtRawCorr           (x PNetRegPtRawCorrNeutrino)
#     "UParTAK4"    -> UParTAK4RegPtRawCorr, or   UParTAK4RegPtRawCorrNeutrino
#                                                  alone for "PlusNeutrino"
#   which reproduces exactly what the old workflow computed by hand.
# * `apply_jec_MC`/`apply_jec_Data`/`apply_jer_MC` are False for those jet
#   types: THE REGRESSED pT IS NOT CORRECTED FURTHER, the regression is the only
#   thing applied. This is what the MC truth derivation needs, since the whole
#   point is to measure the correction that the regressed pT still needs.
#   (Because no JEC is applied to them, these jet types need no entry in
#   `jet_types`/`variations`: the calibrator never looks them up.)
# * `sort_by_pt` is False everywhere, so all the collections keep the NanoAOD
#   jet order and stay index-aligned with `Jet`. The workflow relies on this to
#   copy the regressed pT back onto `Jet` as extra fields.
#
# The nominal `Jet` collection
# ----------------------------
# By default no JEC is applied to `Jet` either (`apply_jec_MC: False`): the JEC
# reference response of the derivation is built by re-applying the standard
# L2Relative txt file on the raw pT (`reapply_jec: true` in the run card), which
# is the correction the MC truth derivation is compared against.
# To use the official corrlib JEC (L1L2L3Res) instead, set
# `apply_jec_MC.<year>.AK4PFPuppi: True` here AND `reapply_jec: false` in the
# run card.
#
# Everything not listed here is inherited from the PocketCoffea defaults; the
# collections that this analysis does not use (FatJet, CorrT1METJet) are
# explicitly set to null so that the calibrator skips them.
# =============================================================================

