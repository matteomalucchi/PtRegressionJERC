# Boolean flags
mixed_mode: true
resolution_vs_pt_gen: true
resolution_vs_pt_reco: true
histograms_map: true
histograms_response: true
gaussian_fit_resolution: true
gaussian_fit_cut_tails: [0.87]
gaussian_fit_max_sigma_rel_err: 1.0
min_events_for_fit: 50
ci_conf_level: 0.87

# Response variable options (applied to all response variables)
normalize_by_response_mean: false  # plot sigma / <R> instead of bare sigma
additional_uncertainty: "0.0"  # add (v*sigma) in quadrature to error
add_min_err: "0.0"  # add a minimal uncertainty floor in quadrature
add_chi2_ndof: false  # multiply error by sqrt(chi2/ndf) where >1
response_mean_method: "auto"  # auto | gaussian_fit | histogram | mean_storage
# NSC fit initial parameters [N, S, C, d]
nsc_fit_parameters: [3.5, 0.5, 0.05, -1.0]
# NSC fit parameter limits (null = no limit = ±inf); set to null to disable all limits
nsc_fit_parameter_limits:
  lower: [-5.0, 0.0, 0.0, null]
  upper: [20.0, 10.0, 5.0, null]


# Bin arrays (anchors allow reuse below without duplication)
pu_bins: &pu_bins [0, 20, 30, 40, 50, 60, 70, 100]
jet_eta_bins: &jet_eta_bins
  [-5.191, -3.839, -3.489, -3.139, -2.964, -2.853, -2.65, -2.5, -2.322,
   -2.172, -2.043, -1.93, -1.74, -1.566, -1.305, -1.044, -0.783, -0.522,
   -0.261, 0.0, 0.261, 0.522, 0.783, 1.044, 1.305, 1.566, 1.74, 1.93,
   2.043, 2.172, 2.322, 2.5, 2.65, 2.853, 2.964, 3.139, 3.489, 3.839, 5.191]
jet_pt_bins: &jet_pt_bins
  [8, 10, 12, 15, 17, 20, 23, 27, 30, 35, 40, 45, 57, 72, 90, 120, 150,
   200, 300, 400, 550, 750, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500, 5000]

# Reduced bin arrays used when test: true
test_pu_bins: [0, 50, 100]
test_jet_eta_bins: [-5.191, 0.0, 5.191]
test_jet_pt_bins: [8, 50, 120, 200, 300, 400, 550, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000]

# Response histogram settings (anchors for reuse in response_variables)
n_bins_response: &n_bins_response 150
bin_limits_response: &bin_limits_response [0.5, 1.5]

# Resolution plot y-axis limits
y_lim_resolution: [0, 0.35]

# Year tag mapping
year_map:
  "2022_preEE": Summer22
  "2022_postEE": Summer22EE
  "2023_preBPix": Summer23
  "2023_postBPix": Summer23BPix
  "2024": Winter24

# ---------------------------------------------------------------------------
# Bin variable definitions
# ---------------------------------------------------------------------------
bin_variables:
  Pileup_nPU:
    event_var: true
    bin_edges: *pu_bins
    label: '$\mu$'
    name_plot: nPU
    resolution_x_variable: false
    txt_map_to: Rho_fixedGridRhoFastjetAll
  MatchedJets_eta:
    event_var: false
    bin_edges: *jet_eta_bins
    label: '$\eta$'
    name_plot: jet_eta
    resolution_x_variable: false
    txt_name: JetEta
  MatchedJets_pt:
    event_var: false
    bin_edges: *jet_pt_bins
    label: '$p_{\mathrm{T}}^{ptcl}$ [GeV]'
    name_plot: jet_gen_pt
    resolution_x_variable: true
    txt_name: JetPt

bin_variables_neutrino:
  Pileup_nPU:
    event_var: true
    bin_edges: *pu_bins
    label: '$\mu$'
    name_plot: nPU
    resolution_x_variable: false
    txt_map_to: Rho_fixedGridRhoFastjetAll
  MatchedJetsNeutrino_eta:
    event_var: false
    bin_edges: *jet_eta_bins
    label: '$\eta$'
    name_plot: jet_eta
    resolution_x_variable: false
    txt_name: JetEta
  MatchedJetsNeutrino_pt:
    event_var: false
    bin_edges: *jet_pt_bins
    label: '$p_{\mathrm{T}}^{ptcl}$ [GeV]'
    name_plot: jet_gen_pt
    resolution_x_variable: true
    txt_name: JetPt

# ---------------------------------------------------------------------------
# Mapping variable definitions
# ---------------------------------------------------------------------------
mapping_variables:
  Rho_fixedGridRhoFastjetAll:
    event_var: true
    label: '$\rho$ [GeV/area]'
    name_plot: rho
    N_bins: 1000
    bin_vars: [Pileup_nPU]
    linear_fit: true
    fit_with_mean_bin_var: false
    txt_name: Rho
    rebin_for_plotting: true
  MatchedJets_JetPtJEC:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJets_eta, MatchedJets_pt]
    legend_name: JEC
    rebin_for_plotting: true
  MatchedJets_JetPtRaw:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJets_eta, MatchedJets_pt]
    legend_name: Raw
    rebin_for_plotting: true
  MatchedJets_JetPtPNetReg:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJets_eta, MatchedJets_pt]
    legend_name: PNetReg
    rebin_for_plotting: true
  MatchedJets_JetPtUparTReg:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJets_eta, MatchedJets_pt]
    legend_name: UparTReg
    rebin_for_plotting: true
  MatchedJetsNeutrino_JetPtJEC:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt_neutrino
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJetsNeutrino_eta, MatchedJetsNeutrino_pt]
    legend_name: JEC
    rebin_for_plotting: true
  MatchedJetsNeutrino_JetPtRaw:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt_neutrino
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJetsNeutrino_eta, MatchedJetsNeutrino_pt]
    legend_name: Raw
    rebin_for_plotting: true
  MatchedJetsNeutrino_JetPtPNetRegNeutrino:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt_neutrino
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJetsNeutrino_eta, MatchedJetsNeutrino_pt]
    legend_name: PNetRegNeutrino
    rebin_for_plotting: true
  MatchedJetsNeutrino_JetPtUparTRegNeutrino:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$ [GeV]'
    name_plot: jet_reco_pt_neutrino
    N_bins: 1000
    bin_limits: [0, 6000]
    bin_vars: [Pileup_nPU, MatchedJetsNeutrino_eta, MatchedJetsNeutrino_pt]
    legend_name: UparTRegNeutrino
    rebin_for_plotting: true

# ---------------------------------------------------------------------------
# Response variable definitions
# ---------------------------------------------------------------------------
response_variables:
  MatchedJets_ResponseJEC:
    label: '$p_{\mathrm{T}}^{\mathrm{reco}}$/$p_{\mathrm{T}}^{ptcl}$'
    name_plot: response_jec
    N_bins: *n_bins_response
    bin_limits: *bin_limits_response
    bin_vars: [Pileup_nPU, MatchedJets_eta, MatchedJets_pt]
    legend_name: JEC
    map_x_variable: MatchedJets_JetPtJEC
    is_reference: true
    txt_jet_name: AK4PFPuppi
    rebin_for_plotting: false
