# ---------------------------------------------------------------------------
# Plot style settings
# ---------------------------------------------------------------------------
plot_settings:
  JEC:
    color: darkorange
    fmt: "o"
  Raw:
    color: green
    fmt: "s"
  PNetReg:
    color: darkred
    fmt: "<"
  UparTReg:
    color: tomato
    fmt: "^"
  PNetRegNeutrino:
    color: darkblue
    fmt: ">"
  UparTRegNeutrino:
    color: cornflowerblue
    fmt: "v"
